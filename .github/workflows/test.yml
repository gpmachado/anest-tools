name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Autoteste no navegador (index.html?teste)
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --enable-logging=stderr --v=0 \
            --virtual-time-budget=5000 --dump-dom "file://$PWD/index.html?teste" 2> chrome.log > /dev/null || true
          grep -o 'FALHOU[^"]*' chrome.log && exit 1
          grep 'Uncaught' chrome.log | grep -v ServiceWorker && exit 1
          grep -q 'autoteste concluído' chrome.log || { echo 'autoteste não terminou'; tail -50 chrome.log; exit 1; }
          echo 'autoteste ok'
